<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Get Serial Number - SPL 2026</title>
  <link rel="stylesheet" href="../style.css">
  <script src="config.js?v=4"></script>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #f8f4fb; color: #3c2460; }
    .page-logo { position: fixed; top: 16px; right: 16px; width: clamp(60px, 8vw, 110px); }
    .container { width: min(640px, 100%); background: #ffffff; border: 2px solid #eadff5; border-radius: 16px; padding: clamp(20px, 4vw, 36px); }
    h1 { color: #5b2d91; text-align: center; margin: 0 0 8px; }
    .subtitle, .help-text, label { color: #7d6d8c; }
    .subtitle { text-align: center; margin-bottom: 22px; }
    label { display: block; margin-bottom: 8px; color: #3c2460; font-weight: 600; }
    input, select { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 2px solid #eadff5; background: #ffffff; color: #3c2460; font-size: 16px; }
    input:focus, select:focus { outline: none; border-color: #6a35a8; }
    .form-group { margin-bottom: 16px; }
    .check-row { display: flex; gap: 10px; align-items: center; }
    .check-row input { width: auto; }
    .due { background: #e7f6f8; border: 1px solid #0f8fa6; border-radius: 10px; padding: 12px 14px; color: #0b6f82; font-weight: 700; }
    button { width: 100%; margin-top: 8px; padding: 14px; border: 0; border-radius: 8px; background: #ef6a2f; color: white; font-weight: 700; font-size: 16px; cursor: pointer; }
    button:disabled { background: #e4d4f2; color: #7d6d8c; cursor: not-allowed; }
    .status { display: none; margin-top: 14px; padding: 12px; border-radius: 8px; text-align: center; }
    .status.success { display: block; background: #e7f6f8; color: #0b6f82; }
    .status.error { display: block; background: #fdeceb; color: #7a1c14; }
    .serial { font-size: 42px; font-weight: 800; color: #0f8fa6; text-align: center; margin: 8px 0 16px; }
    .back-link { display: block; text-align: center; margin-top: 18px; color: #6a35a8; }
    #syNumberGroup, #otpGroup, #successPage { display: none; }
    .sy-row { display: flex; gap: 8px; align-items: center; }
    .sy-row input { width: 140px; flex: 0 0 140px; }
    #checkSyBtn { width: auto; margin-top: 0; padding: 12px 18px; white-space: nowrap; }
    .member-preview { display: none; }
    .sy-check-result { display: none; margin-top: 10px; padding: 10px 12px; border-radius: 8px; line-height: 1.6; }
    .sy-check-result.success { display: block; background: #e7f6f8; color: #0b6f82; }
    .sy-check-result.error { display: block; background: #fdeceb; color: #7a1c14; }
    .sy-check-result span { color: #0b6f82; display: inline-block; width: 110px; }
  </style>
</head>
<body>
  <script src="menu.js"></script>
  <img src="../Surabhi_Yuvasena_Logo.png" alt="Surabhi Yuvasena" class="page-logo">
  <div class="container">
    <h1>SPL 2026 Payment Entry</h1>
    <p class="subtitle">Record a payment and issue the player's serial number</p>
    <form id="paymentForm">
      <div class="form-group">
        <label for="playerEmail">Player email *</label>
        <input type="email" id="playerEmail" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="feeType">Fee type *</label>
        <select id="feeType" required>
          <option value="">Select fee</option>
          <option value="500">₹500 — no captaincy</option>
          <option value="2000">₹2000 — with captaincy</option>
        </select>
        <small class="help-text">This is the fee before the member exemption.</small>
      </div>
      <div class="form-group">
        <label class="check-row"><input type="checkbox" id="syMember"> Surabhi Yuvasena member (₹500 exemption)</label>
      </div>
      <div class="form-group" id="syNumberGroup">
        <label for="syNumber">SY number *</label>
        <div class="sy-row">
          <input type="text" id="syNumber" maxlength="30" autocomplete="off">
          <button type="button" id="checkSyBtn">Check</button>
        </div>
        <div id="syCheckResult" class="sy-check-result"></div>
      </div>
      <div class="form-group">
        <label>Amount to collect</label>
        <div class="due" id="amountDue">Select a fee type</div>
      </div>
      <div class="form-group">
        <label for="paidTo">Paid to *</label>
        <select id="paidTo" required>
          <option value="">Select organiser</option>
          <option value="Chiranjeevi">Chiranjeevi</option>
          <option value="N R Rao">N R Rao</option>
        </select>
        <small class="help-text">The OTP is sent to the selected organiser.</small>
      </div>
      <button type="button" id="sendOtpBtn">Send OTP for verification</button>
      <div class="form-group" id="otpGroup">
        <label for="otp">Organiser OTP *</label>
        <input type="text" id="otp" inputmode="numeric" maxlength="6" autocomplete="off">
        <button type="button" id="verifyOtpBtn">Verify OTP and issue serial</button>
      </div>
      <div id="statusMessage" class="status"></div>
    </form>
    <div id="successPage">
      <h2 style="text-align:center;color:#0f8fa6;">Payment recorded</h2>
      <p class="subtitle">Give this serial number to the player</p>
      <div class="serial" id="serialNumberDisplay"></div>
      <a class="back-link" href="get_serial.html">Enter another payment</a>
    </div>
    <a class="back-link" id="backLink" href="../2026.html">SPL 2026 home</a>
  </div>
  <script>
    let ORGANIZERS = {
      'Chiranjeevi': 'chiranjeevi.vanarasa20@gmail.com',
      'N R Rao': 'nrrao.art@gmail.com'
    };
    function loadOrganizers() {
      const select = document.getElementById('paidTo');
      const previous = select.value;
      fetch(window.SPL2026_SCRIPT_URL + '?action=organizers&format=json')
        .then(function (response) { return response.text(); })
        .then(function (body) {
          const data = JSON.parse(body);
          if (!data || !data.organizers || !data.organizers.length) return;
          ORGANIZERS = {};
          select.innerHTML = '<option value="">Select organiser</option>';
          data.organizers.forEach(function (person) {
            ORGANIZERS[person.name] = person.email;
            const option = document.createElement('option');
            option.value = person.name;
            option.textContent = person.name;
            select.appendChild(option);
          });
          if (ORGANIZERS[previous]) select.value = previous;
        })
        .catch(function () {});
    }
    loadOrganizers();
    let otpSent = false;
    let checkedSyNumber = '';

    function showStatus(message, type) {
      const el = document.getElementById('statusMessage');
      el.textContent = message;
      el.className = 'status ' + type;
    }
    function scriptReady() {
      if (!window.SPL2026_SCRIPT_URL || String(window.SPL2026_SCRIPT_URL).indexOf('PASTE_') === 0) {
        showStatus('Paste the deployed Apps Script URL into 2026/config.js before recording payments.', 'error');
        return false;
      }
      return true;
    }
    function currentFee() {
      const fee = parseInt(document.getElementById('feeType').value || '0', 10);
      return fee === 500 || fee === 2000 ? fee : 0;
    }
    function updateDue() {
      const fee = currentFee();
      const member = document.getElementById('syMember').checked;
      document.getElementById('syNumberGroup').style.display = member ? 'block' : 'none';
      const due = document.getElementById('amountDue');
      if (!fee) {
        due.textContent = 'Select a fee type';
        return;
      }
      const amount = member ? fee - 500 : fee;
      due.textContent = '₹' + amount + (member ? ' (₹' + fee + ' minus ₹500 SY exemption)' : '');
    }
    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function (ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }
    function hideStatus() {
      const el = document.getElementById('statusMessage');
      el.textContent = '';
      el.className = 'status';
    }
    function showSyResult(message, type) {
      const el = document.getElementById('syCheckResult');
      el.innerHTML = message;
      el.className = 'sy-check-result ' + type;
    }
    function clearSyCheck() {
      checkedSyNumber = '';
      const el = document.getElementById('syCheckResult');
      el.className = 'sy-check-result';
      el.innerHTML = '';
    }
    document.getElementById('feeType').addEventListener('change', updateDue);
    document.getElementById('syMember').addEventListener('change', function () {
      updateDue();
      if (!this.checked) clearSyCheck();
    });
    document.getElementById('syNumber').addEventListener('input', clearSyCheck);

    document.getElementById('checkSyBtn').addEventListener('click', async function () {
      if (!scriptReady()) return;
      const syNumber = document.getElementById('syNumber').value.trim();
      if (!syNumber) {
        showSyResult('Enter the SY number.', 'error');
        return;
      }
      const btn = this;
      btn.disabled = true;
      btn.textContent = 'Checking...';
      clearSyCheck();
      hideStatus();
      try {
        const response = await fetch(window.SPL2026_SCRIPT_URL + '?action=lookupSyMember&format=json&syNumber=' + encodeURIComponent(syNumber));
        const body = await response.text();
        let data = null;
        try { data = JSON.parse(body); } catch (ignored) {}
        if (!data || !data.found) {
          const details = (data && data.error) || body;
          const notOnList = String(details).indexOf('was not found in the SY Memberlist') !== -1;
          showSyResult(notOnList ? 'Ask the player to check SY number again.' : escapeHtml((data && data.error) || 'Could not check the SY number. Try again.'), 'error');
          btn.disabled = false;
          btn.textContent = 'Check';
          return;
        }
        checkedSyNumber = syNumber;
        showSyResult('<div><span>Name</span>' + escapeHtml(data.name) + '</div><div><span>Father name</span>' + escapeHtml(data.fatherName) + '</div>', 'success');
      } catch (error) {
        showSyResult('Could not check the SY number. ' + escapeHtml(error.message), 'error');
      }
      btn.disabled = false;
      btn.textContent = 'Check';
    });

    document.getElementById('sendOtpBtn').addEventListener('click', async function () {
      if (!scriptReady()) return;
      const playerEmail = document.getElementById('playerEmail').value.trim();
      const paidTo = document.getElementById('paidTo').value;
      const member = document.getElementById('syMember').checked;
      const syNumber = document.getElementById('syNumber').value.trim();
      const fee = currentFee();
      if (!playerEmail || !fee || !paidTo || (member && !syNumber)) {
        showStatus('Enter the email, fee type, organiser, and the SY number for a member.', 'error');
        return;
      }
      if (member && checkedSyNumber !== syNumber) {
        showStatus('Check the SY number before sending the OTP.', 'error');
        return;
      }
      const btn = this;
      btn.disabled = true;
      btn.textContent = 'Checking email...';
      try {
        const check = await fetch(window.SPL2026_SCRIPT_URL + '?action=checkEmailInPaymentSheet&email=' + encodeURIComponent(playerEmail));
        const checkText = await check.text();
        if (checkText.toLowerCase().indexOf('error') !== -1 || checkText.toLowerCase().indexOf('already') !== -1) {
          showStatus(checkText, 'error');
          btn.disabled = false;
          btn.textContent = 'Send OTP for verification';
          return;
        }
        btn.textContent = 'Sending OTP...';
        const organizerEmail = ORGANIZERS[paidTo];
        const response = await fetch(window.SPL2026_SCRIPT_URL + '?action=sendOtpToOrganizer&email=' + encodeURIComponent(organizerEmail) + '&paidTo=' + encodeURIComponent(paidTo));
        const result = await response.text();
        if (result.indexOf('success') !== -1 || result.indexOf('OTP sent') !== -1) {
          showStatus('OTP sent to ' + paidTo + ' (' + organizerEmail + ').', 'success');
          document.getElementById('otpGroup').style.display = 'block';
          otpSent = true;
          btn.textContent = 'Resend OTP';
        } else {
          showStatus(result, 'error');
          btn.textContent = 'Send OTP for verification';
        }
      } catch (error) {
        showStatus('Could not reach the registration service. ' + error.message, 'error');
        btn.textContent = 'Send OTP for verification';
      }
      btn.disabled = false;
    });

    document.getElementById('verifyOtpBtn').addEventListener('click', async function () {
      if (!scriptReady() || !otpSent) {
        showStatus('Send the organiser OTP first.', 'error');
        return;
      }
      const playerEmail = document.getElementById('playerEmail').value.trim();
      const paidTo = document.getElementById('paidTo').value;
      const member = document.getElementById('syMember').checked;
      const syNumber = document.getElementById('syNumber').value.trim();
      const fee = currentFee();
      const otp = document.getElementById('otp').value.trim();
      if (!/^\d{6}$/.test(otp)) {
        showStatus('Enter the 6-digit OTP.', 'error');
        return;
      }
      const btn = this;
      btn.disabled = true;
      btn.textContent = 'Verifying...';
      try {
        const organizerEmail = ORGANIZERS[paidTo];
        const verify = await fetch(window.SPL2026_SCRIPT_URL + '?action=verifyOtpForOrganizer&email=' + encodeURIComponent(organizerEmail) + '&otp=' + encodeURIComponent(otp));
        const verifyText = await verify.text();
        if (verifyText.indexOf('success') === -1 && verifyText.indexOf('verified') === -1) {
          showStatus(verifyText || 'Invalid OTP.', 'error');
          btn.disabled = false;
          btn.textContent = 'Verify OTP and issue serial';
          return;
        }
        const submit = await fetch(window.SPL2026_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            action: 'addPaymentEntry',
            email: playerEmail,
            feeType: String(fee),
            syMember: member ? 'Yes' : 'No',
            syNumber: member ? syNumber : '',
            paidTo: paidTo
          })
        });
        const submitText = await submit.text();
        const serialMatch = submitText.match(/Serial Number:\s*(\d+)/i);
        if (serialMatch) {
          document.getElementById('paymentForm').style.display = 'none';
          document.getElementById('successPage').style.display = 'block';
          document.getElementById('serialNumberDisplay').textContent = serialMatch[1];
        } else {
          showStatus(submitText || 'Payment was not saved.', 'error');
          btn.disabled = false;
          btn.textContent = 'Verify OTP and issue serial';
        }
      } catch (error) {
        showStatus('Could not save the payment. ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Verify OTP and issue serial';
      }
    });
  </script>
</body>
</html>
