<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registered Players - SPL 2026</title>
  <link rel="stylesheet" href="../style.css">
  <script src="config.js?v=5"></script>
  <style>
    body { margin: 0; min-height: 100vh; background: #f8f4fb; color: #3c2460; }
    .page-logo { position: fixed; top: 16px; right: 16px; width: clamp(60px, 8vw, 110px); z-index: 20; }
    .content { padding: 88px 16px 40px; max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 8px; color: #5b2d91; font-size: clamp(26px, 4vw, 36px); }
    .subtitle { color: #7d6d8c; margin: 0 0 18px; }
    .table-wrap { overflow-x: auto; background: #ffffff; border: 1px solid #eadff5; border-radius: 16px; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eadff5; white-space: nowrap; }
    th { color: #5b2d91; font-size: 14px; background: #f8f4fb; }
    td { color: #3c2460; }
    td.captain-name { color: #0f8fa6; font-weight: 700; }
    .status { margin-top: 16px; color: #7d6d8c; }
    .status.error { color: #b42318; }
    .back-link { display: inline-block; margin-top: 18px; color: #6a35a8; }
  </style>
</head>
<body>
  <img src="../Surabhi_Yuvasena_Logo.png" alt="Surabhi Yuvasena" class="page-logo">
  <main class="content">
    <h1>Registered Players</h1>
    <p class="subtitle">Captains are listed first, then the other players, by serial number.</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Serial number</th>
            <th>Name</th>
            <th>Father name</th>
            <th>Category</th>
            <th>Captaincy</th>
            <th>Jersey name</th>
            <th>Jersey number</th>
          </tr>
        </thead>
        <tbody id="playerRows"></tbody>
      </table>
    </div>
    <p id="statusMessage" class="status">Loading registered players...</p>
    <a class="back-link" href="../2026.html">SPL 2026 home</a>
  </main>
  <script>
    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    function showStatus(message, isError) {
      const status = document.getElementById('statusMessage');
      status.textContent = message;
      status.className = isError ? 'status error' : 'status';
    }

    function renderPlayers(players) {
      const body = document.getElementById('playerRows');
      body.innerHTML = '';
      if (!players.length) {
        showStatus('No players are registered yet.', false);
        return;
      }
      players.forEach(function (player) {
        const row = document.createElement('tr');
        row.innerHTML =
          '<td>' + escapeHtml(player.serialNumber) + '</td>' +
          '<td' + (player.captaincy === 'Yes' ? ' class="captain-name"' : '') + '>' + escapeHtml(player.name) + '</td>' +
          '<td>' + escapeHtml(player.fatherName) + '</td>' +
          '<td>' + escapeHtml(player.category) + '</td>' +
          '<td>' + escapeHtml(player.captaincy) + '</td>' +
          '<td>' + escapeHtml(player.jerseyName) + '</td>' +
          '<td>' + escapeHtml(player.jerseyNumber) + '</td>';
        body.appendChild(row);
      });
      showStatus(players.length + (players.length === 1 ? ' player' : ' players'), false);
    }

    function loadPlayers() {
      const callbackName = 'spl2026_players_' + Date.now();
      const script = document.createElement('script');
      let finished = false;
      const timer = setTimeout(function () { finish(null); }, 20000);
      function finish(data) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        try { delete window[callbackName]; } catch (ignored) {}
        if (script.parentNode) script.parentNode.removeChild(script);
        if (!data || !data.success || !data.players) {
          showStatus('Registered players cannot be loaded yet. Deploy the latest SPL 2026 Apps Script.', true);
          return;
        }
        renderPlayers(data.players);
      }
      window[callbackName] = function (data) { finish(data); };
      script.onerror = function () { finish(null); };
      const url = new URL(window.SPL2026_SCRIPT_URL);
      url.searchParams.set('action', 'registeredPlayers');
      url.searchParams.set('callback', callbackName);
      script.src = url.toString();
      document.body.appendChild(script);
    }

    loadPlayers();
  </script>
</body>
</html>
