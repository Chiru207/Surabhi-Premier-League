<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Surabhi Premier League</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.18), transparent 42%),
        #0f172a;
    }
    .page-logo {
      position: fixed;
      top: 16px;
      right: 16px;
      width: clamp(64px, 10vw, 110px);
      height: auto;
    }
    .chooser {
      width: min(720px, 100%);
      background: #111827;
      border: 2px solid #334155;
      border-radius: 20px;
      padding: clamp(28px, 5vw, 48px);
      text-align: center;
      box-shadow: 0 24px 40px rgba(0, 0, 0, 0.28);
    }
    h1 {
      margin: 0 0 8px;
      color: #f8fafc;
      font-size: clamp(28px, 5vw, 42px);
    }
    .org {
      color: #93c5fd;
      letter-spacing: 0.08em;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      margin: 0 0 28px;
    }
    .years {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    a.year {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-decoration: none;
      color: white;
      border-radius: 16px;
      padding: 28px 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 1px solid #60a5fa;
    }
    a.year span {
      font-size: clamp(28px, 4vw, 36px);
    }
    a.year small {
      font-weight: 500;
      color: #dbeafe;
    }
    a.year.previous {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-color: #475569;
    }
    a.year.previous small {
      color: #94a3b8;
    }
    a.year:hover {
      transform: translateY(-2px);
    }
    @media (max-width: 640px) {
      .years { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <img src="Surabhi_Yuvasena_Logo.png" alt="Surabhi Yuvasena" class="page-logo">
  <main class="chooser">
    <div class="org">SURABHI YUVASENA</div>
    <h1>Surabhi Premier League</h1>
    <p>Choose the tournament year</p>
    <div class="years">
      <a class="year previous" href="2025.html">
        <span>2025</span>
        <small>Previous tournament</small>
      </a>
      <a class="year" href="2026.html">
        <span>2026</span>
        <small>Registration is open</small>
      </a>
    </div>
  </main>
</body>
</html>
